[package]
name = "notelume"
version = "0.2.0"
description = "Markdown 知识库编辑器（Typora 式 WYSIWYG + 精简 Obsidian 知识库能力）"
authors = ["NoteLume"]
edition = "2021"

# Tauri v2 推荐结构：逻辑放在 lib，main.rs 仅做入口
[lib]
name = "notelume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
# P5 §6.6：单实例。二次唤起（双击已关联的 .md / 命令行再开一个）时把新路径
# 转发给已在运行的窗口，不起第二个进程。
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5.2.9"
# 批次 E：本地 Git（L）+ 内置远程（R1-B）。R1-B 需 ssh+https 两个 feature；Windows MSVC 目标下预期 libgit2 自动选 Schannel TLS（免 openssl）、libssh2 用 win32-crypto 后端（亦免 openssl）。Phase 0 闸口验证这个假设；若 cargo tree 出现 openssl-sys 即假设失败降级。
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "ssh", "https"] }
# 功能项 I：.docx（OOXML = ZIP + XML）离线解析。zip 仅读（default-features=false + deflate，走纯 Rust flate2、不引 zlib/openssl）；roxmltree/sha2 皆纯 Rust lib。base64 复用 lib.rs 手写 encode/decode（项目既有“不引 base64 crate”约定），不新增依赖。
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
sha2 = "0.10"
# 批次 F 子项目①：md→docx 结构导出（写侧）。docx-rs 为唯一新增依赖（MIT、纯 Rust、无 openssl）。
# 保留默认 image feature：Pic::new 能把库内任意格式（jpg/gif/webp…）统一转 PNG 并算尺寸；
# 若关掉 image，docx-rs 仅能正确写 PNG（new_with_dimensions 不转码），而 ① 要导出的图格式不定→正确性优先。
# Docx::build()→XMLDocx 暴露 document/media 等原始部件，供③ OMML 注入。
docx-rs = "0.4"
# 文件系统监听：检测外部对库文件的增删改，自动刷新树
notify = { version = "6", features = ["crossbeam-channel"] }

# 大模型接入（AI）：OpenAI 兼容 /chat/completions 的流式代理。HTTP 必须在 Rust 侧做
# （WebView 里的 fetch 撞 CORS）。TLS 用 native-tls：Windows 走系统 Schannel、mac 走
# Security.framework，都不引 openssl（reqwest 0.13 的 rustls feature 默认绑 aws-lc-rs，
# Windows 构建要 NASM/CMake，故不用）。json 只为 .json(&body)；流式读用 Response::chunk()，
# 不需要 stream feature。若未来 Linux 打包嫌 openssl，再换 rustls-no-provider + ring。
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
