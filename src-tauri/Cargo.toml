[package]
name = "notelume"
version = "0.1.0"
description = "Markdown 知识库编辑器（Typora 式 WYSIWYG + 精简 Obsidian 知识库能力）"
authors = ["NoteLume"]
edition = "2021"

# Tauri v2 推荐结构：逻辑放在 lib，main.rs 仅做入口
[lib]
name = "notelume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
trash = "5.2.9"
