# lume.hackersnail.online —— NoteLume 网页版沙盒的宿主 nginx 反代
# 部署位置：服务器 /etc/nginx/conf.d/lume-domain.conf（证书由 certbot --nginx 追加在同文件）
# 关键：必须显式 server_name 精确匹配——snail-share.conf 里有 listen 80 default_server
# 且整站反代简历后端（127.0.0.1:8000），没有本块的域名会被它兜底接走（含裸 IP 访问）。
server {
    listen 80;
    server_name lume.hackersnail.online;

    # 访客上传本机文件走 base64 JSON body，给足余量
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:1420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- 另一份部署件：/etc/nginx/conf.d/lume-ip.conf（裸 IP 直连，2026-10-20 上线）----
# 上面那块只认 lume.hackersnail.online；访问 http://111.229.204.162/ 时 Host 是 IP 本身，
# 会被 snail-share.conf 的 default_server 兜去简历站。这块用精确 server_name 抢回来。
# 证书只签给域名，IP 没有可用证书，故只出 80。
server {
    listen 80;
    server_name 111.229.204.162;

    # 访客上传本机文件（导入 Word）走 base64 JSON body，给足余量
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:1420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
