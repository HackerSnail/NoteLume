# NoteLume CI
# 触发：master 分支 push + v* 标签（发版）+ 任意 PR + 手动
# 打包只在 master push / tag / 手动时执行；tag 发的 Release 为草稿，需到 Releases 页面手动 Publish 才对外可见。
# 网页版测试（web:test）依赖 web 分支上的 src/web 与 server/tests，web 分支经 PR 提交时由 web 作业把关。

name: CI

on:
  push:
    branches: [master]
    # 发版：推 v* 标签（如 v0.1.0）时自动打包并挂到该 tag 的草稿 Release
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行被新提交取代时自动取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 前端：vite 构建 + 桌面端测试（src/tests 下非 web- 前缀的手写测试）──
  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm ci

      - name: Vite build
        run: npm run build

      - name: Desktop tests (src/tests, skip web-*)
        run: |
          failed=0
          for f in tests/*.test.mjs; do
            case "$f" in tests/web-*) echo "--- skip $f"; continue;; esac
            echo "=== $f ==="
            node "$f" || failed=1
          done
          exit $failed

  # ── 网页版：构建 dist + server/tests 与 src/tests/web-* 跑批（仅 web 分支）──
  web:
    name: Web build & tests
    if: github.ref == 'refs/heads/web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            server/package-lock.json

      - name: Install deps
        run: |
          npm --prefix src ci
          npm --prefix server ci

      - name: Web build
        run: npm run web:build

      - name: Web tests
        run: npm run web:test

  # ── Rust：Tauri 后端 cargo check + test（src-tauri）──
  rust:
    name: Rust (src-tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri Linux 构建所需的系统库（webkit2gtk 等）
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── 打包：三平台（Linux AppImage / Windows MSI+NSIS / macOS DMG）──
  # 仅 master push / 手动触发→传 artifact；v* tag→额外发草稿 Release
  package-desktop:
    name: Package (${{ matrix.platform }})
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-latest
            bundles: appimage
            artifact_name: NoteLume-Linux-AppImage
            artifact_path: src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows
            runs_on: windows-2022   # 不用 windows-latest（=Server 2025）：镜像移除 .NET Framework 3.5 预装，WiX v3 的 light.exe 打 MSI 会无输出直接失败
            bundles: nsis   # Tauri v2 Windows 合法值是 msi/nsis（空格分隔多值；wix 是 v1 旧名）
            artifact_name: NoteLume-Windows
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos
            runs_on: macos-latest   # ARM64 runner，产出 Apple Silicon 包；无开发者证书，走 ad-hoc 签名（Wrap mac dmg 那一步）
            bundles: app dmg        # 必须连 app 一起要：只要 dmg 时 Tauri 组完卷会把 bundle/macos/NoteLume.app 清掉，收尾脚本就没法按它重卷 dmg
            artifact_name: NoteLume-macOS
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: write  # 建/改 Release 需要
    steps:
      - uses: actions/checkout@v4

      # Tauri Linux 构建所需的系统库（webkit2gtk 等），仅 Linux 平台安装
      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      # tauri CLI 装在 src/ 下，beforeBuildCommand 会先跑 vite 构建
      - name: Install frontend deps
        run: npm --prefix src ci

      - name: Build bundles
        run: node src/node_modules/@tauri-apps/cli/tauri.js build --bundles ${{ matrix.bundles }}

      # mac 收尾，与本地 `npm run build` 的 postbuild 同一脚本：先补 ad-hoc 签名（Tauri 出的是
      # linker-signed，直接分发报「已损坏」），再按 stage 重卷 dmg、把 docs/macOS打开说明.txt 装进卷宗。
      # 前提是本平台 bundles 里带 app，卷宗里那份 .app 才还在。
      - name: Wrap mac dmg
        if: matrix.platform == 'macos'
        run: node scripts/wrap-mac-dmg.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # ── 发版：三平台打包全部结束后，汇总 artifact 发一个草稿 Release（仅 v* tag）──
  # 单独收口是为了避免 matrix 各作业并发改同一 Release 产生命令/草稿竞态。
  publish:
    name: Publish draft Release
    needs: package-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
