<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteLume — Markdown 知识库编辑器</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- 图标表：全站唯一的图形来源。静态 HTML 与 JS（icons.js）都只用 <use href="#i-*"> 引用，
         描边色继承 currentColor，浅色/暗黑/吸血鬼主题下自动换色。 -->

      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6.5 9.5 12 15l5.5-5.5" /></symbol>

      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h8.5M17.5 8H20M4 16h2.5M11 16h9" /><circle cx="15" cy="8" r="2.2" /><circle cx="8.5" cy="16" r="2.2" /></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 16V4" /><path d="M8 7.5 12 3.5l4 4" /><path d="M4.5 14v6.5h15V14" /></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M4 12h16" /><path d="M12 4c2.6 2.3 2.6 13.7 0 16M12 4c-2.6 2.3-2.6 13.7 0 16" /></symbol>
      <symbol id="i-printer" viewBox="0 0 24 24"><path d="M7 8V4h10v4" /><path d="M4 8h16v8h-3" /><path d="M7 16H4V8" /><path d="M7 12.5h10V20H7z" /></symbol>
      <symbol id="i-keyboard" viewBox="0 0 24 24"><path d="M3 7.5h18v9H3z" /><path d="M6.5 11h.01M10 11h.01M13.5 11h.01M17 11h.01M7.5 14h9" /></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3.5" /><circle cx="12" cy="12" r="0.6" fill="currentColor" stroke="none" /></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M9 5.5H7a1.5 1.5 0 0 0-1.5 1.5v12A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V7A1.5 1.5 0 0 0 17 5.5h-2" /><path d="M9 3.5h6v4H9z" /><path d="M9 12.5h6M9 16h4" /></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="M15 4.5 20.5 10 12.5 18H7L4 15z" /><path d="M8.5 20.5H20" /></symbol>

      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8.5 4.5 4 9l4.5 4.5" /><path d="M4 9h10.5a5 5 0 0 1 0 10H8" /></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15.5 4.5 20 9l-4.5 4.5" /><path d="M20 9H9.5a5 5 0 0 0 0 10H16" /></symbol>
      <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8" /><path d="M20 4v4.5h-4.5" /></symbol>

      <symbol id="i-align-middle" viewBox="0 0 24 24"><path d="M4 12h16" /><path d="M8 6v12M14 7.5v9" /></symbol>
      <symbol id="i-align-bottom" viewBox="0 0 24 24"><path d="M4 20h16" /><path d="M8 5v11M14 9v7" /></symbol>
      <symbol id="i-dist-h" viewBox="0 0 24 24"><path d="M3.5 4.5v15M20.5 4.5v15" /><path d="M8.5 6v12M15.5 6v12" /></symbol>
      <symbol id="i-dist-v" viewBox="0 0 24 24"><path d="M4.5 3.5h15M4.5 20.5h15" /><path d="M6 8.5h12M6 15.5h12" /></symbol>
      <symbol id="i-group" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></symbol>
      <symbol id="i-ungroup" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /><path d="M9.5 9.5h5v5h-5z" /></symbol>
      <symbol id="i-minimap" viewBox="0 0 24 24"><path d="M3.5 5h17v14h-17z" /><path d="M7 9h6v8H7z" /></symbol>
      <symbol id="i-sidebar" viewBox="0 0 24 24"><path d="M3.5 5h17v14h-17z" /><path d="M9.5 5v14" /></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15" /></symbol>
      <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /><path d="M11 8.5v5M8.5 11h5" /></symbol>
      <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /><path d="M8.5 11h5" /></symbol>
      <symbol id="i-pilcrow" viewBox="0 0 24 24"><path d="M12 4v16M18 4v16M8 4H6.5a3.5 3.5 0 0 0 0 7H8" /></symbol>

      <symbol id="i-list-ordered" viewBox="0 0 24 24"><path d="M10 6.5h9M10 12h9M10 17.5h9" /><path d="M4 4.5h1.5v4M3.5 15.6c0-1.8 2.6-1.6 2.6 0 0 1.2-2.6 1.9-2.6 3.4h2.8" /></symbol>

    <div id="app">
      <header class="toolbar">
        <div class="btn-group">
          <button id="btn-open-file" title="打开单个 Markdown 文件 (Ctrl+O)"><svg class="nl-ico"><use href="#i-file" /></svg>打开文件</button>
          <button id="btn-open" title="打开文件夹作为知识库 (Ctrl+Shift+O)"><svg class="nl-ico"><use href="#i-folder" /></svg>打开知识库</button>
          <button id="btn-new-file" title="在知识库根目录新建 Markdown 文件"><svg class="nl-ico"><use href="#i-file-plus" /></svg>新建</button>
          <button id="btn-save" title="保存 (Ctrl+S)"><svg class="nl-ico"><use href="#i-save" /></svg>保存</button>
          <button id="btn-daily" title="今日速记（全局浮层，独立于知识库） (Ctrl+Shift+D)"><svg class="nl-ico"><use href="#i-calendar" /></svg>今日</button>
          <button id="btn-source" title="Markdown 源码模式（原文，带高亮/行号） (Ctrl+E)"><svg class="nl-ico"><use href="#i-code" /></svg>源码</button>
          <button id="btn-more" title="更多操作（导出 / 打印 / 图谱 / 画布 / 模板 / 模式）"><svg class="nl-ico"><use href="#i-chevron-down" /></svg>更多</button>
        </div>
        <span id="docstats" class="docstats" title="写作统计（点击设置字数目标）"></span>
        <span id="filename" class="filename">未打开文档</span>
        <span class="spacer"></span>
        <label class="autosave-toggle" title="开启后：停止输入 2s 自动写回原文件；每 2分钟保留一份时间戳副本到库内 .notelume-backup/">
          <input type="checkbox" id="chk-autosave" /> 自动保存
        </label>
        <button id="btn-theme" title="切换主题"><svg class="nl-ico"><use href="#i-moon" /></svg>暗黑</button>
      </header>


      <div class="body">
        <div class="side-corner" role="group">
          <button type="button" class="side-corner-btn" data-tab="files" title="文件"><svg class="nl-ico"><use href="#i-folder" /></svg></button>
          <button type="button" class="side-corner-btn" data-tab="outline" title="大纲"><svg class="nl-ico"><use href="#i-list-bullet" /></svg></button>
          <button type="button" class="side-corner-btn" id="btn-inspector" title="检查器"><svg class="nl-ico"><use href="#i-sliders" /></svg></button>
        </div>
        <aside class="sidebar" id="sidebar">
          <section class="panel">
            <div class="side-tabs" role="tablist">
              <button type="button" class="side-tab" data-tab="files" role="tab" aria-selected="true"><svg class="nl-ico"><use href="#i-folder" /></svg>文件</button>
              <button type="button" class="side-tab" data-tab="outline" role="tab" aria-selected="false"><svg class="nl-ico"><use href="#i-list-bullet" /></svg>大纲</button>
            </div>
            <input id="search-input" class="search-input" type="search" placeholder="标题 / 正文 / #标签" autocomplete="off" />
            <div id="search-results" class="search-results"></div>
            <div id="filetree" class="filetree"></div>
            <nav id="outline" class="outline hidden"></nav>
          </section>
        </aside>
        <div class="nl-gutter" id="gutter-side" role="separator" aria-orientation="vertical" title="拖拽改变侧栏宽度"></div>

        <main class="editor-pane">
          <div id="editor" class="editor"></div>
          <div id="source-mount" class="nl-source hidden"></div>
          <div id="canvas-mount" class="hidden"></div>
        </main>

        <div class="nl-gutter" id="gutter-insp" role="separator" aria-orientation="vertical" title="拖拽改变检查器宽度"></div>
        <aside class="inspector" id="inspector">
          <section class="panel">
            <h2>文档属性</h2>
            <div id="frontmatter" class="frontmatter"></div>
          </section>
          <section class="panel">
            <h2>标签</h2>
            <div id="tags" class="tags"></div>
            <div class="tags-sub">全局标签</div>
            <div id="tags-global" class="tags tags-global"></div>
            <div id="tags-global-docs" class="tags-global-docs"></div>
          </section>
          <section class="panel">
            <h2>双向链接</h2>
            <div class="bl-h3">引用本文档</div>
            <div id="backlinks" class="link-list"></div>
            <div class="bl-h3">本文档引用</div>
            <div id="outgoing" class="link-list"></div>
          </section>
          <section class="panel">
            <h2><svg class="nl-ico"><use href="#i-box" /></svg>历史版本</h2>
            <div id="snapshots" class="snapshots"></div>
          </section>
          <section class="panel">
            <h2><svg class="nl-ico"><use href="#i-branch" /></svg>Git</h2>
            <div id="git" class="git"></div>
          </section>
          <section class="panel">
            <h2><svg class="nl-ico"><use href="#i-plug" /></svg>插件</h2>
            <div id="plugins" class="plugins"></div>
          </section>
        </aside>
      </div>
    </div>

    <div id="graph-modal" class="graph-modal hidden" role="dialog" aria-label="知识图谱">
      <div class="graph-panel">
        <div class="graph-head">
          <span class="graph-title"><svg class="nl-ico"><use href="#i-graph" /></svg>知识图谱</span>
          <span id="graph-info" class="graph-info"></span>
          <button id="graph-close" class="graph-close" title="关闭 (Esc)"><svg class="nl-ico"><use href="#i-close" /></svg></button>
        </div>
        <canvas id="graph-canvas" class="graph-canvas"></canvas>
      </div>
    </div>

    <div id="snapshot-modal" class="snapshot-modal hidden" role="dialog" aria-label="历史版本预览">
      <div class="snapshot-panel">
        <div class="snapshot-head">
          <span class="snapshot-title"><svg class="nl-ico"><use href="#i-box" /></svg><span id="snapshot-label"></span></span>
          <button id="snapshot-close" class="snapshot-close" title="关闭 (Esc)"><svg class="nl-ico"><use href="#i-close" /></svg></button>
        </div>
        <div id="snapshot-preview" class="snapshot-preview ProseMirror"></div>
        <div class="snapshot-foot">
          <span id="snapshot-meta" class="snapshot-meta"></span>
          <span class="spacer"></span>
          <button id="snapshot-rollback" class="btn-primary"><svg class="nl-ico"><use href="#i-undo" /></svg>回滚到此版本</button>
        </div>
      </div>
    </div>

    <script>
      // 全局错误可视化：任何未捕获异常 / Promise 拒绝都不再显示在界面（状态栏已去掉），
      // 统一打到 console，避免“白屏无反应”时无从排查（模块加载失败也能捕获）。
      window.__nlError = function (msg) {
        console.error('[NoteLume] ' + msg)
      }
      window.addEventListener('error', function (e) {
        window.__nlError('启动错误：' + (e.message || e.error))
      })
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason
        window.__nlError('异步错误：' + ((r && r.message) || r))
      })
    </script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
