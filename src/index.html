<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteLume — Markdown 知识库编辑器</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <button id="btn-open-file" title="打开单个 Markdown 文件 (Ctrl+O)">📄 打开文件</button>
        <button id="btn-open" title="打开文件夹作为知识库 (Ctrl+Shift+O)">📂 打开知识库</button>
        <button id="btn-save" title="保存 (Ctrl+S)">💾 保存</button>
        <button id="btn-daily" title="今日速记（全局浮层，独立于知识库） (Ctrl+Shift+D)">📅 今日</button>
        <button id="btn-source" title="Markdown 源码模式（原文，带高亮/行号） (Ctrl+/)">&lt;/&gt; 源码</button>
        <button id="btn-more" title="更多操作（导出 / 打印 / 图谱 / 画布 / 模板 / 模式）">▾ 更多</button>
        <span id="docstats" class="docstats" title="写作统计（点击设置字数目标）"></span>
        <span id="filename" class="filename">未打开文档</span>
        <span class="spacer"></span>
        <label class="autosave-toggle" title="开启后：停止输入 2s 自动写回原文件；每 2分钟保留一份时间戳副本到库内 .notelume-backup/">
          <input type="checkbox" id="chk-autosave" /> 自动保存
        </label>
        <span id="status" class="status">选择本地文件夹作为知识库开始编辑</span>
        <button id="btn-theme" title="切换主题">🌙 暗黑</button>
      </header>

      <div class="body">
        <aside class="sidebar">
          <section class="panel">
            <h2>搜索</h2>
            <input id="search-input" class="search-input" type="search" placeholder="标题 / 正文 / #标签" autocomplete="off" />
            <div id="search-results" class="search-results"></div>
          </section>
          <section class="panel">
            <h2>文件</h2>
            <div id="filetree" class="filetree"></div>
          </section>
          <section class="panel">
            <h2>大纲</h2>
            <nav id="outline" class="outline"></nav>
          </section>
          <section class="panel">
            <h2>文档属性</h2>
            <div id="frontmatter" class="frontmatter"></div>
          </section>
          <section class="panel">
            <h2>标签</h2>
            <div id="tags" class="tags"></div>
            <div class="tags-sub">全局标签</div>
            <div id="tags-global" class="tags tags-global"></div>
            <div id="tags-global-docs" class="tags-global-docs"></div>
          </section>
          <section class="panel">
            <h2>双向链接</h2>
            <div class="bl-h3">引用本文档</div>
            <div id="backlinks" class="link-list"></div>
            <div class="bl-h3">本文档引用</div>
            <div id="outgoing" class="link-list"></div>
          </section>
          <section class="panel">
            <h2>📦 历史版本</h2>
            <div id="snapshots" class="snapshots"></div>
          </section>
          <section class="panel">
            <h2>🌿 Git</h2>
            <div id="git" class="git"></div>
          </section>
          <section class="panel">
            <h2>🔌 插件</h2>
            <div id="plugins" class="plugins"></div>
          </section>
        </aside>

        <main class="editor-pane">
          <div id="editor" class="editor"></div>
          <div id="source-mount" class="nl-source hidden"></div>
          <div id="canvas-mount" class="hidden"></div>
        </main>
      </div>
    </div>

    <div id="graph-modal" class="graph-modal hidden" role="dialog" aria-label="知识图谱">
      <div class="graph-panel">
        <div class="graph-head">
          <span class="graph-title">🕸 知识图谱</span>
          <span id="graph-info" class="graph-info"></span>
          <button id="graph-close" class="graph-close" title="关闭 (Esc)">✕</button>
        </div>
        <canvas id="graph-canvas" class="graph-canvas"></canvas>
      </div>
    </div>

    <div id="snapshot-modal" class="snapshot-modal hidden" role="dialog" aria-label="历史版本预览">
      <div class="snapshot-panel">
        <div class="snapshot-head">
          <span class="snapshot-title">📦 <span id="snapshot-label"></span></span>
          <button id="snapshot-close" class="snapshot-close" title="关闭 (Esc)">✕</button>
        </div>
        <div id="snapshot-preview" class="snapshot-preview ProseMirror"></div>
        <div class="snapshot-foot">
          <span id="snapshot-meta" class="snapshot-meta"></span>
          <span class="spacer"></span>
          <button id="snapshot-rollback" class="btn-primary">↩ 回滚到此版本</button>
        </div>
      </div>
    </div>

    <script>
      // 全局错误可视化：任何未捕获异常 / Promise 拒绝都写进状态栏，
      // 避免“白屏无反应”时看不到原因（模块加载失败也能捕获）。
      window.__nlError = function (msg) {
        var s = document.getElementById('status')
        if (s) {
          s.textContent = '⚠ ' + msg
          s.style.color = '#c0392b'
        }
      }
      window.addEventListener('error', function (e) {
        window.__nlError('启动错误：' + (e.message || e.error))
      })
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason
        window.__nlError('异步错误：' + ((r && r.message) || r))
      })
    </script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
