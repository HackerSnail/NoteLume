<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteLume — Markdown 知识库编辑器</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <button id="btn-open" title="打开文件夹作为知识库 (Ctrl+O)">📂 打开知识库</button>
        <button id="btn-save" title="保存 (Ctrl+S)">💾 保存</button>
        <span id="filename" class="filename">未打开文档</span>
        <span class="spacer"></span>
        <span id="status" class="status">选择本地文件夹作为知识库开始编辑</span>
        <button id="btn-theme" title="切换主题">🌙 暗黑</button>
      </header>

      <div class="body">
        <aside class="sidebar">
          <section class="panel">
            <h2>文件</h2>
            <div id="filetree" class="filetree"></div>
          </section>
          <section class="panel">
            <h2>大纲</h2>
            <nav id="outline" class="outline"></nav>
          </section>
          <section class="panel">
            <h2>标签</h2>
            <div id="tags" class="tags"></div>
          </section>
        </aside>

        <main class="editor-pane">
          <div id="editor" class="editor"></div>
        </main>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
